<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% placeholder page_title default %}{{ this.page.title }}{% endplaceholder %}</title>
        {% partial "meta/styles" %}
        {% partial "meta/seo" %}
        <meta name="generator" content="Winter CMS">
    </head>
    {% set pageId = this.page.id %}
    {% set pageTitle = this.page.title %}
    {% if pageId is empty %}
        {% set pageId = page.id %}
    {% endif %}
    {% if pageTitle is empty %}
        {% set pageTitle = page.title %}
    {% endif %}
    <body class="page-{{ pageId }} layout-{{ this.layout.id }}">
        <header class="site-header">
            <a class="site-header__brand" href="/">
                <img src="{{ 'assets/images/vim-icon-192.png'|theme }}" alt="VIM">
                <span>VIM</span>
            </a>

            <nav class="site-header__nav" aria-label="Navigazione principale">
                <a class="site-header__link" href="/">Istruzioni</a>
                <a class="site-header__access" href="/login">Area riservata</a>
            </nav>
        </header>
